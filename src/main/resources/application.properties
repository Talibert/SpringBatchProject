spring.application.name=meu-projeto

spring.profiles.active=postgres,kafka

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Spring Batch
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never
spring.main.allow-bean-definition-overriding=true

jwt.secret=K7gNU3sdo+OL0wNhqoVWhr3g6s1xYv72ol/pe/Unols=
jwt.expiration=86400000

admin.seed.firstName=Admin
admin.seed.lastName=Course
admin.seed.email=admin@course.com
admin.seed.password=${ADMIN_SEED_PASSWORD:MaluZoe}
spring.kafka.enabled=true

# SpringDoc OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.show-actuator=true

# Spring Boot Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true